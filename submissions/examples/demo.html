<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Morph-Glow Tooltip - EaseMotion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="mt-layout">
        <main class="mt-main">
            <h1 class="mt-title">TELEMETRY HOVER ZONE</h1>
            <p class="mt-desc">Hover over the action element to reveal the morphing glow tooltip.</p>
            
            <div class="mt-tooltip-container" tabindex="0">
                <span class="mt-trigger-btn">INSPECT NODE</span>
                
                <div class="mt-tooltip">
                    <span class="mt-tooltip-header">STATUS // SECURE</span>
                    <p class="mt-tooltip-text">Node response latency is optimal across all regional proxy endpoints.</p>
                </div>
            </div>
        </main>
    </div>
</body>
</html>
